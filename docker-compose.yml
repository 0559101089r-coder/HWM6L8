version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_backend
    restart: always
    env_file:
      - .env
    volumes:
      - back_static:/app/static
      - back_media:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - back_static:/app/static
      - back_media:/app/media
    depends_on:
      - backend

volumes:
  back_static:
  back_media: